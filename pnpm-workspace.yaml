packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11+ only reads auth/registry from .npmrc — every other setting (node-linker,
# hoist, public-hoist-pattern, ...) must live here instead, or it's silently ignored.
# .npmrc still carries the old-style keys (kept for pre-11 pnpm / documentation of
# intent), but this block is what actually takes effect now. Without nodeLinker:
# hoisted, pnpm falls back to its isolated .pnpm-symlink layout, which breaks every
# `../../node_modules/<pkg>` alias in the app vite.config.mts files and any bare
# import of a hoisted-only transitive dep (e.g. @mui/x-internals from AdapterDayjs).
nodeLinker: hoisted
shamefullyHoist: true
hoistPattern:
  - '*'
publicHoistPattern:
  - '*'
  - 'pdfjs-dist'
strictPeerDependencies: false
autoInstallPeers: true

allowBuilds:
  '@parcel/watcher': false
  '@scarf/scarf': true
  core-js: true
  electron: true
  electron-winstaller: true
  esbuild: true
  fsevents: true
  nx: true
  phantomjs-prebuilt: false
  sharp: true

